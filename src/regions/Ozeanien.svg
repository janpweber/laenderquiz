<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 289" overflow="visible" role="img" aria-label="Ozeanien aus Dreiecken">
<style>
.tri { transform-box: fill-box; transform-origin: center; animation: confetti 2.2s cubic-bezier(.3,.6,.35,1) var(--d) both; }
.city { animation: confetti 2.2s cubic-bezier(.3,.6,.35,1) var(--d) both, pulse 1.6s ease-in-out calc(var(--d) + 2.2s) infinite; }
@keyframes confetti {
  0% { transform: translate(var(--x0), var(--y0)) scale(0.2); opacity: 0; }
  8% { opacity: 1; }
  30% { transform: translate(var(--x1), var(--y1)) rotate(var(--r1)); }
  62% { transform: translate(var(--x2), var(--y2)) rotate(var(--r2)); }
  100% { transform: none; }
}
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }
.still .tri { animation: none; }
.still .city { animation: pulse 1.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .tri, .city { animation: none; } }
</style>
