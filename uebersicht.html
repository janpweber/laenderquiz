<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Länderquiz – alle Umrisse</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      body { padding: 16px; }
      h1 { font-size: 1.6rem; margin-bottom: 4px; }
      .hint { margin: 0 0 16px; }
      h2 { font-size: 1rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--red); margin: 24px 0 8px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
      figure { margin: 0; background: var(--white); border-radius: 10px; padding: 8px; }
      figure svg { width: 100%; aspect-ratio: 1; display: block; }
      figure path { fill: var(--red); }
      figure.tiny path { stroke: var(--red); stroke-width: 12; }
      figcaption { font-size: 0.8rem; font-weight: 700; text-align: center; margin-top: 4px; }
      .tiny { display: inline-block; font-size: 0.65rem; background: var(--black); color: var(--white); border-radius: 4px; padding: 1px 5px; margin-left: 4px; }
    </style>
  </head>
  <body>
    <h1>Alle 193 Umrisse</h1>
    <p class="hint">Zum Prüfen: Jedes Land sollte erkennbar sein. „winzig“ kommt nur im Modus „Schwer“ vor.</p>
    <div id="list"></div>
    <script type="module" src="/src/uebersicht.ts"></script>
  </body>
</html>
